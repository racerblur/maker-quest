<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Battle Arena · Maker Quest</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#59318a,#1b1030 75%);color:white;font:16px system-ui,sans-serif;text-align:center}header{padding:18px}a{color:#72edff}h1{margin:8px;font-size:clamp(2rem,6vw,3.4rem)}p{color:#e5d6f4}.setup{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px}label{display:grid;gap:5px;text-align:left;font-size:.85rem}select,button{font:inherit;border-radius:12px;padding:12px;background:#563780;color:white;border:2px solid #a48bd5}button{cursor:pointer;background:#e98ad1;color:#25113c;font-weight:800}button:focus-visible,select:focus-visible{outline:3px solid cyan}.hud{display:flex;justify-content:space-between;max-width:780px;margin:10px auto;padding:0 12px;font-weight:bold}canvas{width:min(96vw,780px);height:auto;aspect-ratio: 780 / 440;border:3px solid #a77de9;border-radius:14px;background:#241b45;touch-action:none}.controls{display:flex;justify-content:space-between;align-items:center;max-width:780px;margin:12px auto;padding:0 20px;gap:12px}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:4px}.pad button{width:56px;height:52px;padding:0;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .down{grid-column:2}.pad .right{grid-column:3;grid-row:2}.attack{width:108px;height:108px;border-radius:100%;touch-action:none}.status{min-height:28px;font-weight:800;color:#79efff}@media(min-width:800px){.controls{max-width:560px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><header><a href="./">← Maker Quest</a><h1>🤖 Bot Battle Arena</h1><p>Build your bot. Outsmart the rival. Win the arena!</p></header><div class="setup"><label>Chassis<select id="chassis"><option value="balanced">Balanced</option><option value="light">Speedster</option><option value="heavy">Tank</option></select></label><label>Weapon<select id="weapon"><option value="blaster">Blaster</option><option value="rapid">Rapid fire</option><option value="heavy">Heavy shot</option></select></label><button id="start">Start battle</button></div><div class="hud"><span id="playerHp">YOU ♥ 100</span><span id="enemyHp">RIVAL ♥ 100</span></div><canvas id="arena" width="780" height="440" aria-label="Top-down robot battle arena"></canvas><div class="status" id="status" aria-live="polite">Choose your robot parts and start the battle.</div><div class="controls"><div class="pad"><button class="up" data-key="up" aria-label="Move up">▲</button><button class="left" data-key="left" aria-label="Move left">◀</button><button class="down" data-key="down" aria-label="Move down">▼</button><button class="right" data-key="right" aria-label="Move right">▶</button></div><button class="attack" data-key="fire">FIRE ⚡</button></div><p>Keyboard: WASD / arrow keys to move · Space to fire</p><script>
const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d'),keys=new Set(),status=document.getElementById('status');let player,enemy,shots=[],running=false,last=0,enemyShotTimer=0,playerShotTimer=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function begin(){let chassis=document.getElementById('chassis').value;player={x:130,y:220,hp:chassis==='heavy'?140:chassis==='light'?80:100,max:chassis==='heavy'?140:chassis==='light'?80:100,speed:chassis==='heavy'?130:chassis==='light'?245:180,color:'#60eaff'};enemy={x:650,y:220,hp:100,max:100,speed:105,color:'#ff85cf'};shots=[];enemyShotTimer=0;playerShotTimer=0;running=true;last=performance.now();status.textContent='Battle started! Move and fire!';document.getElementById('start').textContent='Restart battle';requestAnimationFrame(loop)}
document.getElementById('start').onclick=begin;
function shoot(from,to,hostile,weapon){const a=Math.atan2(to.y-from.y,to.x-from.x),speed=weapon==='heavy'?290:380;shots.push({x:from.x,y:from.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,hostile,damage:weapon==='heavy'?22:weapon==='rapid'?7:12,r:weapon==='heavy'?8:5})}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
function update(dt){let dx=(keys.has('right')?1:0)-(keys.has('left')?1:0),dy=(keys.has('down')?1:0)-(keys.has('up')?1:0),m=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/m*player.speed*dt,22,758);player.y=clamp(player.y+dy/m*player.speed*dt,22,418);
let dist=Math.hypot(player.x-enemy.x,player.y-enemy.y)||1;if(dist>180){enemy.x+=((player.x-enemy.x)/dist)*enemy.speed*dt;enemy.y+=((player.y-enemy.y)/dist)*enemy.speed*dt}enemy.x=clamp(enemy.x,22,758);enemy.y=clamp(enemy.y,22,418);
const weapon=document.getElementById('weapon').value;playerShotTimer-=dt;enemyShotTimer-=dt;if(keys.has('fire')&&playerShotTimer<=0){shoot(player,enemy,false,weapon);playerShotTimer=weapon==='rapid'?.14:weapon==='heavy'?.62:.32}if(enemyShotTimer<=0){shoot(enemy,player,true,'blaster');enemyShotTimer=.85}
for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;const target=s.hostile?player:enemy;if(Math.hypot(s.x-target.x,s.y-target.y)<23){target.hp=Math.max(0,target.hp-s.damage);shots.splice(i,1)}else if(s.x<0||s.x>780||s.y<0||s.y>440)shots.splice(i,1)}
document.getElementById('playerHp').textContent='YOU ♥ '+Math.ceil(player.hp);document.getElementById('enemyHp').textContent='RIVAL ♥ '+Math.ceil(enemy.hp);
if(player.hp<=0||enemy.hp<=0){running=false;status.textContent=enemy.hp<=0?'🏆 Victory! Your bot wins!':'💥 Defeat! Rebuild and try again.'}}
function bot(b){ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle=b.color;ctx.strokeStyle='#160d2b';ctx.lineWidth=4;ctx.fillRect(-20,-18,40,36);ctx.strokeRect(-20,-18,40,36);ctx.fillStyle='#17112c';ctx.fillRect(-27,-17,8,34);ctx.fillRect(19,-17,8,34);ctx.fillStyle='#fff';ctx.fillRect(-10,-8,8,8);ctx.fillRect(3,-8,8,8);ctx.restore();ctx.fillStyle='#241532';ctx.fillRect(b.x-25,b.y-36,50,6);ctx.fillStyle=b.color;ctx.fillRect(b.x-25,b.y-36,50*b.hp/b.max,6)}
function draw(){ctx.clearRect(0,0,780,440);ctx.fillStyle='#251b46';ctx.fillRect(0,0,780,440);ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let x=0;x<780;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,440);ctx.stroke()}for(let y=0;y<440;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(780,y);ctx.stroke()}ctx.strokeStyle='#8b6bca';ctx.lineWidth=10;ctx.strokeRect(5,5,770,430);if(player)bot(player);if(enemy)bot(enemy);for(const s of shots){ctx.fillStyle=s.hostile?'#ffb0d8':'#79efff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>keys.delete(k))});
const keymap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',' ':'fire'};document.addEventListener('keydown',e=>{if(e.target.matches('select'))return;const k=keymap[e.key];if(k){e.preventDefault();keys.add(k)}});document.addEventListener('keyup',e=>{const k=keymap[e.key];if(k)keys.delete(k)});window.addEventListener('blur',()=>keys.clear());draw();
</script></body></html>
