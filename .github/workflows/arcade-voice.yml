name: Generate arcade announcer clips
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/arcade-voice.yml'
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download natural male announcer recordings
        run: |
          mkdir -p assets/announcer
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/1a324667623b4d2a9215920c67536db6/f49763c1a284420b8f25f16472d8738e/id=de21f71b153947c59a65217e960f46f9.mp3' -o assets/announcer/crash1.mp3
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/1a324667623b4d2a9215920c67536db6/f49763c1a284420b8f25f16472d8738e/id=3b3403b0ede143e5bbb46f8675f61fe3.mp3' -o assets/announcer/crash2.mp3
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/1a324667623b4d2a9215920c67536db6/f49763c1a284420b8f25f16472d8738e/id=641ff76bcaa443698f1ad6adb38880eb.mp3' -o assets/announcer/crash3.mp3
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/1a324667623b4d2a9215920c67536db6/f49763c1a284420b8f25f16472d8738e/id=e56df70b56524fe9971c5353dfa97fa8.mp3' -o assets/announcer/low1.mp3
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/1a324667623b4d2a9215920c67536db6/f49763c1a284420b8f25f16472d8738e/id=ad23b97fc7cb49a3b044cd2faedb3631.mp3' -o assets/announcer/low2.mp3
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/1a324667623b4d2a9215920c67536db6/f49763c1a284420b8f25f16472d8738e/id=90cc2116dff6404aa72b3076322503c3.mp3' -o assets/announcer/empty.mp3
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/1a324667623b4d2a9215920c67536db6/f49763c1a284420b8f25f16472d8738e/id=1380b6d787b74a04ae4764d7c19d0136.mp3' -o assets/announcer/win.mp3
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/1a324667623b4d2a9215920c67536db6/f49763c1a284420b8f25f16472d8738e/id=70d5b386aa214ca2be7c2886f1b56784.mp3' -o assets/announcer/lose.mp3
      - name: Commit announcer recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fL --retry 3 'https://resource2.heygen.ai/text_to_speech/1a324667623b4d2a9215920c67536db6/f49763c1a284420b8f25f16472d8738e/id=ebbac0af50ef46abb9c39b4e08f84203.mp3' -o assets/announcer/start.mp3
          git add assets/announcer/*.mp3
          if ! git diff --cached --quiet; then git commit -m "Add prerecorded arcade announcer audio"; git pull --rebase origin main; git push origin HEAD:main; fi
