name: Generate arcade announcer clips
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/arcade-voice.yml'
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local voice recordings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
          mkdir -p assets/announcer
          while IFS='|' read -r filename words; do
            [ -z "$filename" ] && continue
            espeak -s 170 -p 65 -v en-us --stdout "$words" | ffmpeg -loglevel error -y -i pipe:0 -ar 16000 -ac 1 -b:a 32k "assets/announcer/$filename.mp3"
          done <<'LINES'
          start|Racers ready! Three, two, one, GO!
          crash1|Ouch! That's a wall, not a turn!
          crash2|Nice parking job! Now try racing!
          crash3|That obstacle isn't going anywhere!
          low1|Battery low! Ease off the gas!
          low2|Twenty percent left! Drive smarter!
          empty|Out of juice! The race is over!
          win|You win! Amazing driving!
          lose|The computer wins! Better luck next time!
          LINES
      - name: Commit announcer recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/announcer/*.mp3
          if ! git diff --cached --quiet; then git commit -m "Add prerecorded arcade announcer audio"; git pull --rebase origin main; git push origin HEAD:main; fi
